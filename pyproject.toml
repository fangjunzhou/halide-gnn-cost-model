[project]
name = "halide-gnn-cost-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.7",
    "networkx>=3.5",
    "pydot>=4.0.1",
    "scipy>=1.16.3",
    "tensorboard>=2.20.0",
    "torch>=2.9.0",
    "torch-geometric>=2.7.0",
    "torchtext>=0.6.0",
    "torchvision>=0.24.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "halide-gnn-cost-model",
    "jupyterlab>=4.4.10",
    "ipywidgets>=8.1.8",
    "pip>=25.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
